server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub2api.ieasycode.cc;

    ssl_certificate /etc/nginx/ssl/admin.ieasycode.cc/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.ieasycode.cc/origin.key;

    client_max_body_size 256M;

    access_log /var/log/nginx/sub2api.ieasycode.cc.access.log;
    error_log /var/log/nginx/sub2api.ieasycode.cc.error.log;

    location / {
        proxy_pass http://10.124.0.3:8320;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sub2api.ieasycode.cc;
    return 301 https://$host$request_uri;
}
